# Configuration locale du projet Supabase RESALE BOT.
# À utiliser avec la CLI Supabase (`supabase start`, `supabase db push`, etc.).
# Le project_id est un identifiant local de projet CLI, pas l'URL du projet distant.

project_id = "resale-bot"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://127.0.0.1:5173"
additional_redirect_urls = [
  "http://localhost:5173",
  "http://127.0.0.1:5173",
  "https://taki-glitch.github.io/Resale-bot/"
]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[functions.analyze-listing]
verify_jwt = true
